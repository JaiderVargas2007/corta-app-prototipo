<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Corta · Ventas de ruta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============ PANTALLA: LOGIN ============ -->
<div id="screen-login" class="screen screen-login">
  <div class="login-wrap">
    <div class="login-brand">
      <div class="brand-mark">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 4c-3 5-9 6-9 12 0 3 2 5 2 5s-6 1-6 8c0 5.5 4.5 9 9 9 2 0 3.5-.7 4-1 .5.3 2 1 4 1 4.5 0 9-3.5 9-9 0-7-6-8-6-8s2-2 2-5c0-6-6-7-9-12z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="20" cy="24" r="1.6" fill="currentColor"/>
          <circle cx="27" cy="21" r="1.6" fill="currentColor"/>
          <circle cx="26" cy="29" r="1.6" fill="currentColor"/>
        </svg>
      </div>
      <h1>Corta</h1>
      <p>Ventas de ruta · Cortadores de galletas</p>
    </div>

    <form id="login-form" class="login-card" autocomplete="off">
      <div class="field">
        <label for="login-email">Correo</label>
        <input id="login-email" type="email" placeholder="jefe@corta.com" value="jefe@corta.com" required />
      </div>
      <div class="field">
        <label for="login-pass">Contraseña</label>
        <input id="login-pass" type="password" placeholder="••••••••" value="corta123" required />
      </div>
      <p class="login-error" id="login-error" hidden>Correo o contraseña incorrectos.</p>
      <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
      <p class="login-hint">Prototipo de demostración — cualquier correo y contraseña funcionan.</p>
    </form>
  </div>
</div>

<!-- ============ APP (una vez logueado) ============ -->
<div id="app" class="app" hidden>

  <!-- Sidebar (desktop) -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark small">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 4c-3 5-9 6-9 12 0 3 2 5 2 5s-6 1-6 8c0 5.5 4.5 9 9 9 2 0 3.5-.7 4-1 .5.3 2 1 4 1 4.5 0 9-3.5 9-9 0-7-6-8-6-8s2-2 2-5c0-6-6-7-9-12z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <span>Corta</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-user" id="sidebar-user"></div>
  </aside>

  <!-- Top bar (mobile) -->
  <header class="topbar">
    <button class="icon-btn" id="btn-back" hidden aria-label="Volver">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="topbar-title">Inicio</h1>
    <button class="icon-btn" id="btn-notif" aria-label="Notificaciones">
      <svg viewBox="0 0 24 24"><path d="M12 3a5 5 0 0 0-5 5v3.2c0 .6-.2 1.1-.6 1.6L5 15h14l-1.4-2.2c-.4-.5-.6-1-.6-1.6V8a5 5 0 0 0-5-5z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span class="dot"></span>
    </button>
  </header>

  <!-- Contenido principal -->
  <main id="app-content" class="app-content"></main>

  <!-- Bottom nav (mobile) -->
  <nav class="bottomnav" id="bottomnav"></nav>

  <!-- FAB registrar venta -->
  <button class="fab" id="fab-venta" aria-label="Registrar venta">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
</div>

<!-- Contenedor genérico de modales / hojas inferiores -->
<div id="sheet-overlay" class="sheet-overlay" hidden>
  <div class="sheet" id="sheet-body"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
